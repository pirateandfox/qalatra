name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Single macOS job — electron-builder builds both arm64 and x64 on the
  # arm64 runner. It calls @electron/rebuild internally for each arch, so
  # cross-compilation of native modules (better-sqlite3, node-pty) is handled
  # automatically. Running two jobs caused a 422 race condition because both
  # jobs built all configured arches and tried to upload the same files.
  release-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install setuptools (for node-gyp / Python 3.12+)
        run: pip3 install setuptools --break-system-packages

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Check all imports are bundled
        run: node scripts/check-imports.mjs

      - name: Build and publish Electron app (arm64 + x64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always

  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install setuptools (for node-gyp / Python 3.12+)
        run: pip install setuptools

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Check all imports are bundled
        run: node scripts/check-imports.mjs

      - name: Build and publish Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  release-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install setuptools (for node-gyp / Python 3.12+)
        run: pip3 install setuptools --break-system-packages

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Check all imports are bundled
        run: node scripts/check-imports.mjs

      - name: Build and publish Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish always

  publish-release:
    runs-on: ubuntu-latest
    needs: [release-mac, release-windows, release-linux]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Guardrail: electron-builder treats an upload to a pre-existing release
      # that's >2h old as a no-op and still exits 0 ("skipped publishing").
      # A re-run after a partial/failed first attempt can therefore leave a
      # green-but-incomplete release missing binaries or, worse, the auto-updater
      # manifests (latest*.yml) — which silently breaks in-app updates. Fail loudly
      # here, before the release is un-drafted, so a broken release is never shipped.
      - name: Verify all platform assets are present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REQUIRED=(
            "latest.yml"                              # Windows updater manifest
            "latest-mac.yml"                          # macOS updater manifest
            "latest-linux.yml"                        # Linux x64 updater manifest
            "latest-linux-arm64.yml"                  # Linux arm64 updater manifest
            "Qalatra-${VERSION}.dmg"
            "Qalatra-${VERSION}-arm64.dmg"
            "Qalatra-${VERSION}-mac.zip"              # updater feed reads the zip, not the dmg
            "Qalatra-${VERSION}-arm64-mac.zip"
            "Qalatra-Setup-${VERSION}.exe"
            "Qalatra-${VERSION}.AppImage"
            "Qalatra-${VERSION}-arm64.AppImage"
          )
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          echo "Assets currently on $TAG:"
          echo "${ASSETS:-  (none)}"
          MISSING=()
          for f in "${REQUIRED[@]}"; do
            grep -qxF "$f" <<< "$ASSETS" || MISSING+=("$f")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Release $TAG is missing ${#MISSING[@]} required asset(s):"
            printf '::error::  - %s\n' "${MISSING[@]}"
            echo "electron-builder likely skipped uploads to a pre-existing release."
            echo "Fix: delete the release but keep the tag, then re-run this workflow —"
            echo "  gh release delete $TAG --yes"
            exit 1
          fi
          echo "All ${#REQUIRED[@]} required assets present."

      - name: Add changelog and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES_FILE="plan/releases/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="$(mktemp)"
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              git log --pretty=format:"- %s" --no-merges > "$NOTES_FILE"
            else
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges > "$NOTES_FILE"
            fi
          fi
          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" \
              --title "Qalatra $VERSION" \
              --notes-file "$NOTES_FILE" \
              --draft=false
          else
            gh release create "$TAG" \
              --title "Qalatra $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
