name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The mobile OTA runtime guard's append-only half compares mobile/runtime-versions.json
          # against HEAD^1 — the base-branch tip on a pull_request's merge commit, the previous
          # develop on a push. Depth 2 is the minimum that makes that ref resolvable. Raise it if a
          # later step needs more history; do not remove it.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies for system Node
        run: npm ci --ignore-scripts

      - name: Audit root dependencies
        run: npm run audit:root

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Audit UI dependencies
        run: npm audit --audit-level=moderate --prefix ui

      - name: Check mobile OTA runtime version
        run: npm run check:mobile-runtime:ci

      - name: Test mobile OTA runtime guard
        run: npm run test:mobile-runtime

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Audit mobile dependencies
        run: npm run audit:mobile

      - name: Typecheck shared core
        run: npm run shared:typecheck

      - name: Test account client
        run: npm run test:account

      - name: Typecheck mobile client
        run: npm run typecheck --prefix mobile

      - name: Lint UI
        run: npm run lint --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Check Electron packaging imports
        run: npm run check-imports

      - name: Smoke headless server
        run: npm run ci:server
